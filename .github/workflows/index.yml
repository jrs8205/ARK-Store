name: Build store index

# Rebuilds the list of published apps and puts it on the "index" branch, where the app
# downloads it from.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/build_index.py
      - .github/workflows/index.yml

permissions:
  contents: write

concurrency:
  group: store-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the previous index
        run: |
          mkdir -p previous
          curl -fsSL -o previous/index.json \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/index/index.json" || true

      - name: Build the index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/build_index.py --previous previous/index.json --output out/index.json

      - name: Publish to the index branch
        run: |
          cd out
          git init -q -b index
          git config user.name "${GITHUB_REPOSITORY_OWNER}"
          git config user.email "${GITHUB_REPOSITORY_OWNER}@users.noreply.github.com"
          git add index.json
          git commit -q -m "Update the store index"
          # The branch holds only the newest index, so its history never grows.
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            index
