name: Build store index

# Rebuilds the list of published apps and puts it on the "index" branch, where the app
# downloads it from.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  # A release of the store itself is listed right away rather than at the next scheduled run.
  release:
    types: [published, edited, deleted]
  push:
    branches: [main]
    paths:
      - tools/build_index.py
      - tools/build_repos.py
      - tools/build_forge.py
      - .github/workflows/index.yml

permissions:
  contents: write

concurrency:
  group: store-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # A release runs this workflow at its tag, which may be on another branch. The index is
      # always built with the script on main.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Test the index builder
        run: python3 -m unittest discover -s tools

      # One clone rather than one download per file, so that the files come from the same run.
      # Only a branch that does not exist yet means starting afresh. A clone that fails for
      # any other reason stops the run: building without the previous index would publish a
      # much shorter one.
      - name: Fetch the previous index
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}.git"
          found=0
          git ls-remote --exit-code --heads "$url" index > /dev/null || found=$?
          if [ "$found" -eq 0 ]; then
            git clone -q --depth 1 --branch index "$url" previous
          elif [ "$found" -eq 2 ]; then
            mkdir -p previous
          else
            exit "$found"
          fi

      - name: Build the index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          if [ -f previous/state.json ]; then cp previous/state.json out/state.json; fi
          python3 tools/build_index.py --previous previous/index.json \
            --previous-auto previous/auto.json --state out/state.json \
            --output out/index.json --auto-output out/auto.json

      # F-Droid and IzzyOnDroid, each boiled down to a list of its own. A catalogue that has
      # not changed is not downloaded again, and one that cannot be reached keeps its list.
      - name: Build the lists of the other catalogues
        run: python3 tools/build_repos.py --previous-dir previous --output-dir out

      # Apps released on Codeberg: those published with the store topic, and those found by
      # searching. Whatever cannot be read keeps its previous entry.
      - name: Build the lists of apps on Codeberg
        run: python3 tools/build_forge.py --previous-dir previous --output-dir out

      - name: Publish to the index branch
        run: |
          cd out
          git init -q -b index
          git config user.name "${GITHUB_REPOSITORY_OWNER}"
          git config user.email "${GITHUB_REPOSITORY_OWNER}@users.noreply.github.com"
          git add index.json auto.json state.json fdroid.json izzy.json forge.json codeberg.json
          git commit -q -m "Update the store index"
          # The branch holds only the newest index, so its history never grows.
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            index
